<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>kaffa-isiltep</title>
  <meta name="description" content="Vota le bevande delle macchinette di ISILTEP e scopri quali sono le più apprezzate.">
  <meta name="theme-color" content="#5a3319">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="kaffa-isiltep">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☕%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Vai ai contenuti</a>

  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="logo" aria-hidden="true">☕</span>
        <div>
          <h1>kaffa-isiltep</h1>
          <p class="by">by ISILTEP</p>
        </div>
      </div>
      <button id="refresh" class="icon-btn" type="button" aria-label="Aggiorna i risultati" title="Aggiorna i risultati">↻</button>
    </div>
  </header>

  <main id="main">
    <div id="setup-warning" class="notice warn" hidden>
      Configurazione Firebase mancante: compila <code>firebase-config.js</code>.
    </div>
    <div id="notice" class="notice" role="alert" hidden></div>

    <div id="view" aria-busy="true"></div>

    <section id="account" class="account"></section>
  </main>

  <!-- Pannello di voto: sale dal basso sul telefono, finestra centrata sul computer -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-in">
      <div class="sheet-grip" aria-hidden="true"></div>
      <button id="sheet-close" class="icon-btn sheet-close" type="button" aria-label="Chiudi">✕</button>
      <p id="sheet-eyebrow" class="eyebrow"></p>
      <h2 id="sheet-title" class="sheet-title"></h2>
      <p id="sheet-sub" class="sheet-sub"></p>

      <div id="sheet-stars" class="vstars" role="slider" tabindex="0"
           aria-label="Il tuo voto, da 0 a 5 stelle" aria-valuemin="0" aria-valuemax="5" aria-valuestep="0.5"
           aria-valuenow="0" aria-valuetext="Nessun voto"><i id="sheet-fill"></i></div>

      <div class="sheet-row">
        <p id="sheet-label" class="sheet-label" aria-live="polite">Tocca le stelle</p>
        <button id="sheet-zero" class="chip" type="button" aria-pressed="false" aria-label="Dai zero stelle">Dai 0</button>
      </div>
      <p id="sheet-prev" class="sheet-prev"></p>
      <p id="sheet-error" class="sheet-error" role="alert" hidden></p>
      <button id="sheet-save" class="btn block" type="button" disabled>Salva voto</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
